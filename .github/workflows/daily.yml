name: Daily Full-Stack Projects Generator
on:
  schedule:
    # 10 AM Pakistan Time (PKT = UTC+5) -> 05:00 UTC (1st project)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: "How many projects to generate this run"
        required: false
        default: "2"
permissions:
  contents: write
concurrency:
  group: fullstack-forge-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --upgrade google-genai
      - name: Generate daily projects
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECTS_PER_RUN: ${{ github.event.inputs.count || '2' }}
        run: python scripts/generate.py
      - name: Commit and push generated projects
        run: |
          git config user.name "Haris-Ahmed83"
          git config user.email "hariscool987@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(daily): add projects for $DATE"
            git push
          fi
