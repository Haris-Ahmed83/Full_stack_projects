<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card with Hover</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">
                <h2>Jane Doe</h2>
                <p>Web Developer</p>
                <p class="location"><i class="fas fa-map-marker-alt"></i> New York, USA</p>
            </div>
            <div class="card-back">
                <h3>About Me</h3>
                <p>Passionate web developer with 5+ years of experience in building responsive and user-friendly web applications. Specializing in front-end development with a strong focus on React and modern CSS.</p>
                <div class="social-links">
                    <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                </div>
                <button class="contact-btn">Contact Me</button>
            </div>
        </div>
    </div>
</body>
</html>
