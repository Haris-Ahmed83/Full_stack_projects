<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="brand-logo">YourBrand</a>
        </header>
        <div class="content">
            <div class="illustration">
                <!-- SVG Illustration of a broken link, a lost astronaut, or a confused robot -->
                <svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#8e2de2" />
                            <stop offset="100%" stop-color="#4a00e0" />
                        </linearGradient>
                        <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FF5F6D" />
                            <stop offset="100%" stop-color="#FFC371" />
                        </linearGradient>
                    </defs>
                    <!-- Example: A simple "404" with a glitch effect -->
                    <text x="50%" y="50%" text-anchor="middle" font-family="Poppins, sans-serif" font-size="120" font-weight="700" fill="url(#gradient1)" class="glitch-text" data-text="404">404</text>
                    <circle cx="150" cy="180" r="20" fill="#FFC371" class="planet planet1"></circle>
                    <circle cx="350" cy="100" r="15" fill="#FF5F6D" class="planet planet2"></circle>
                    <rect x="200" y="220" width="100" height="5" fill="#8e2de2" rx="2" class="line"></rect>
                    <circle cx="250" cy="222.5" r="8" fill="#4a00e0" class="circle-end"></circle>
                </svg>
            </div>
            <h1>Oops! Page Not Found</h1>
            <p>It looks like you've ventured into uncharted territory. The page you're looking for might have been moved or doesn't exist.</p>
            <div class="actions">
                <a href="/" class="btn primary-btn">Go to Homepage</a>
                <a href="mailto:support@yourbrand.com" class="btn secondary-btn">Contact Support</a>
            </div>
        </div>
        <footer>
            <p>&copy; 2023 YourBrand. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
