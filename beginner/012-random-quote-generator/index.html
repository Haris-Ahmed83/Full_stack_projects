<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Random Quote Generator</h1>
        </header>
        <main class="quote-card">
            <p id="quote-display" class="quote-text">"The only way to do great work is to love what you do."</p>
            <p id="author-display" class="quote-author">- Steve Jobs</p>
            <button id="new-quote-btn" class="new-quote-button">New Quote</button>
        </main>
        <footer class="footer">
            <p>&copy; 2023 Quote Generator. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
