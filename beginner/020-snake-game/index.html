<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #282c34;
            color: #fff;
            font-family: 'Press Start 2P', cursive; /* A retro gaming font, if available or linked */
            font-family: monospace; /* Fallback */
        }
        canvas {
            background-color: #1a1a1a;
            border: 5px solid #61dafb;
            display: block; /* Removes extra space below canvas */
        }
        h1 {
            color: #61dafb;
            margin-bottom: 20px;
        }
        .score-container {
            margin-top: 20px;
            font-size: 1.2em;
        }
        #score {
            color: #f1c40f;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #61dafb;
            color: #282c34;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #21a1f1;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="score-container">
        Score: <span id="score">0</span>
    </div>
    <button id="startButton">Start Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const startButton = document.getElementById('startButton');

        const gridSize = 20; // Size of each segment/food square
        let snake = [{ x: 10, y: 10 }]; // Initial snake position (grid coordinates)
        let food = {};
        let dx = 0; // Direction x
        let dy = 0; // Direction y
        let score = 0;
        let gameInterval;
        let gameRunning = false;
        let changingDirection = false; // To prevent multiple key presses in one frame

        // Initialize game state
        function initGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreDisplay.textContent = score;
            placeFood();
            draw(); // Initial draw of snake and food
            if (gameInterval) clearInterval(gameInterval); // Clear any existing interval
            gameRunning = false;
            startButton.textContent = "Start Game";
            startButton.disabled = false;
        }

        // Draw everything on the canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas

            // Draw food
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

            // Draw snake
            ctx.fillStyle = 'lime';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                ctx.strokeStyle = 'darkgreen';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
        }

        // Generate random food position
        function placeFood() {
            let newFoodX, newFoodY;
            do {
                newFoodX = Math.floor(Math.random() * (canvas.width / gridSize));
                newFoodY = Math.floor(Math.random() * (canvas.height / gridSize));
            } while (isFoodOnSnake(newFoodX, newFoodY)); // Ensure food doesn't spawn on snake

            food = { x: newFoodX, y: newFoodY };
        }

        function isFoodOnSnake(x, y) {
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === x && snake[i].y === y) {
                    return true;
                }
            }
            return false;
        }

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;

            changingDirection = false; // Reset for next frame

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check for collision with walls
            if (head.x < 0 || head.x >= canvas.width / gridSize ||
                head.y < 0 || head.y >= canvas.height / gridSize) {
                endGame();
                return;
            }

            // Check for collision with self
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head); // Add new head

            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                placeFood(); // Generate new food
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            draw();
        }

        // Handle keyboard input
        function changeDirection(event) {
            if (changingDirection || !gameRunning) return; // Ignore input if already changing or game not running
            changingDirection = true;

            const keyPressed = event.keyCode;
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            } else if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            } else if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            } else if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function startGame() {
            if (gameRunning) return; // Prevent multiple starts

            initGame(); // Reset game state
            gameRunning = true;
            startButton.textContent = "Game Running...";
            startButton.disabled = true;

            // Set initial direction to right
            dx = 1;
            dy = 0;

            gameInterval = setInterval(gameLoop, 100); // Game speed (milliseconds)
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            alert(`Game Over! Your score: ${score}`);
            startButton.textContent = "Restart Game";
            startButton.disabled = false;
        }

        // Event Listeners
        document.addEventListener('keydown', changeDirection);
        startButton.addEventListener('click', startGame);

        // Initial setup
        initGame();
    </script>
</body>
</html>
