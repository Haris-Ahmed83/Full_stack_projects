<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Skills Progress</h1>

    <div class="progress-container">

        <div class="progress-bar-wrapper">
            <span class="progress-label">HTML</span>
            <div class="progress-bar" data-progress="90">
                <div class="progress-filler"></div>
                <span class="progress-percentage">0%</span>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <span class="progress-label">CSS</span>
            <div class="progress-bar" data-progress="80">
                <div class="progress-filler"></div>
                <span class="progress-percentage">0%</span>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <span class="progress-label">JavaScript</span>
            <div class="progress-bar" data-progress="75">
                <div class="progress-filler"></div>
                <span class="progress-percentage">0%</span>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <span class="progress-label">React</span>
            <div class="progress-bar" data-progress="60">
                <div class="progress-filler"></div>
                <span class="progress-percentage">0%</span>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <span class="progress-label">Python</span>
            <div class="progress-bar" data-progress="50">
                <div class="progress-filler"></div>
                <span class="progress-percentage">0%</span>
            </div>
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
