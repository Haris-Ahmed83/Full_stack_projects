<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stock Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #0f3460;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        header h1 {
            margin: 0;
            color: #e94560;
        }
        main {
            display: flex;
            flex-grow: 1;
            padding: 20px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .panel {
            background-color: #0f3460;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            padding: 20px;
            flex-basis: 300px;
            flex-grow: 1;
            max-width: calc(50% - 20px);
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }
        .panel.full-width {
            max-width: unset;
            width: 100%;
        }
        .panel h2 {
            margin-top: 0;
            color: #e94560;
            border-bottom: 1px solid #1a1a2e;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        #watchlist {
            flex-basis: 350px;
            max-width: 400px;
        }
        #watchlist ul {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            max-height: calc(100% - 100px); /* Adjust based on h2 and input height */
            flex-grow: 1;
        }
        #watchlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        #watchlist li:last-child {
            border-bottom: none;
        }
        .stock-symbol {
            font-weight: bold;
            color: #e0e0e0;
            font-size: 1.1em;
            cursor: pointer;
        }
        .stock-price {
            font-weight: bold;
            color: #4CAF50; /* Green for positive */
            font-size: 1.1em;
            display: flex;
            align-items: center;
        }
        .stock-price.negative {
            color: #f44336; /* Red for negative */
        }
        .price-change-arrow {
            margin-left: 5px;
            font-size: 0.9em;
        }
        .add-stock-form {
            display: flex;
            margin-top: 15px;
            gap: 10px;
        }
        .add-stock-form input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1a1a2e;
            background-color: #2c3e50;
            color: #e0e0e0;
        }
        .add-stock-form button {
            padding: 8px 15px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .add-stock-form button:hover {
            background-color: #c2314a;
        }
        .remove-stock-btn {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2em;
        }

        #chart-container {
            flex-grow: 2;
            min-height: 400px;
            background-color: #0f3460;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #chart-title {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        #stockChart {
            width: 100%;
            height: 100%;
            max-height: 400px; /* Limit chart height */
        }

        #alerts-panel {
            flex-basis: 100%;
            max-width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }
        #alert-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        #alert-form input, #alert-form select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1a1a2e;
            background-color: #2c3e50;
            color: #e0e0e0;
            min-width: 100px;
        }
        #alert-form button {
            padding: 8px 15px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #alert-form button:hover {
            background-color: #c2314a;
        }
        #active-alerts-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            max-height: 200px;
            background-color: #1a1a2e;
            border-radius: 4px;
            padding: 10px;
        }
        #active-alerts-list li {
            padding: 8px 0;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #active-alerts-list li:last-child {
            border-bottom: none;
        }
        .remove-alert-btn {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            font-size: 1.2em;
        }

        footer {
            background-color: #0f3460;
            padding: 15px;
            text-align: center;
            color: #e0e0e0;
            margin-top: auto;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            main {
                flex-direction: column;
                align-items: center;
            }
            .panel {
                max-width: 100%;
                flex-basis: auto;
                width: 100%;
            }
            #watchlist {
                max-width: 100%;
            }
            #chart-container {
                min-height: 300px;
                height: 300px; /* Ensure chart has a fixed height on smaller screens */
            }
            #alert-form {
                flex-direction: column;
            }
            #alert-form input, #alert-form select, #alert-form button {
                width: 100%;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
</head>
<body>
    <header>
        <h1>Live Stock Ticker</h1>
    </header>

    <main>
        <div id="watchlist" class="panel">
            <h2>My Watchlist</h2>
            <div class="add-stock-form">
                <input type="text" id="new-stock-symbol" placeholder="Add stock symbol (e.g., AAPL)" maxlength="5">
                <button id="add-stock-btn">Add</button>
            </div>
            <ul id="watchlist-items">
                <!-- Watchlist items will be dynamically added here -->
            </ul>
        </div>

        <div id="chart-container">
            <h2 id="chart-title">Select a stock from watchlist to view chart</h2>
            <canvas id="stockChart"></canvas>
        </div>

        <div id="alerts-panel" class="panel full-width">
            <h2>Alerts</h2>
            <div id="alert-form">
                <input type="text" id="alert-symbol" placeholder="Symbol (e.g., MSFT)" maxlength="5">
                <select id="alert-condition">
                    <option value="above">Price Above</option>
                    <option value="below">Price Below</option>
                </select>
                <input type="number" id="alert-value" placeholder="Target Price" step="0.01">
                <button id="set-alert-btn">Set Alert</button>
            </div>
            <h3>Active Alerts</h3>
            <ul id="active-alerts-list">
                <!-- Active alerts will be dynamically added here -->
            </ul>
        </div>
    </main>

    <footer>
        &copy; 2023 Live Stock Ticker. All rights reserved.
    </footer>

    <script>
        const watchlistItems = document.getElementById('watchlist-items');
        const newStockSymbolInput = document.getElementById('new-stock-symbol');
        const addStockBtn = document.getElementById('add-stock-btn');
        const stockChartCanvas = document.getElementById('stockChart');
        const chartTitle = document.getElementById('chart-title');

        const alertSymbolInput = document.getElementById('alert-symbol');
        const alertConditionSelect = document.getElementById('alert-condition');
        const alertValueInput = document.getElementById('alert-value');
        const setAlertBtn = document.getElementById('set-alert-btn');
        const activeAlertsList = document.getElementById('active-alerts-list');

        let watchlist = JSON.parse(localStorage.getItem('watchlist')) || ['AAPL', 'MSFT', 'GOOG'];
        let activeAlerts = JSON.parse(localStorage.getItem('activeAlerts')) || [];
        let chartInstance = null;
        let currentChartSymbol = '';
        const chartData = {}; // Stores historical data for each symbol

        const API_BASE_URL = 'ws://localhost:8080'; // WebSocket server address

        // Initialize WebSocket
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(API_BASE_URL);

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Send initial watchlist to server
                if (watchlist.length > 0) {
                    ws.send(JSON.stringify({ type: 'subscribe', symbols: watchlist }));
                }
                // Send initial alerts to server
                if (activeAlerts.length > 0) {
                    activeAlerts.forEach(alert => {
                        ws.send(JSON.stringify({ type: 'setAlert', symbol: alert.symbol, condition: alert.condition, value: alert.value }));
                    });
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'priceUpdate') {
                    updateStockPrice(data.symbol, data.price);
                    updateChart(data.symbol, data.price, data.timestamp);
                } else if (data.type === 'initialData') {
                    // Populate chartData with initial historical data
                    if (data.symbol && data.history) {
                        chartData[data.symbol] = data.history.map(item => ({
                            time: new Date(item.timestamp).toLocaleTimeString(),
                            value: item.price
                        }));
                        if (data.symbol === currentChartSymbol) {
                            renderChart(currentChartSymbol);
                        }
                    }
                } else if (data.type === 'alertTriggered') {
                    console.warn(`ALERT: ${data.symbol} is ${data.condition} ${data.value}`);
                    alert(`ALERT: ${data.symbol} price is now ${data.condition} ${data.value}! Current price: ${data.currentPrice}`);
                    removeAlert(data.symbol, data.condition, data.value); // Remove triggered alert
                } else if (data.type === 'error') {
                    console.error('Server error:', data.message);
                    alert('Error: ' + data.message);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected. Attempting to reconnect in 5 seconds...');
                setTimeout(connectWebSocket, 5000); // Reconnect after 5 seconds
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                ws.close(); // Close to trigger reconnect
            };
        }

        function renderWatchlist() {
            watchlistItems.innerHTML = '';
            watchlist.forEach(symbol => {
                const listItem = document.createElement('li');
                listItem.dataset.symbol = symbol;
                listItem.innerHTML = `
                    <span class="stock-symbol" onclick="selectStockForChart('${symbol}')">${symbol}</span>
                    <span class="stock-price" id="price-${symbol}">Loading...</span>
                    <button class="remove-stock-btn" onclick="removeStock('${symbol}')">&times;</button>
                `;
                watchlistItems.appendChild(listItem);
            });
            localStorage.setItem('watchlist', JSON.stringify(watchlist));
        }

        function addStock(symbol) {
            symbol = symbol.toUpperCase().trim();
            if (symbol && !watchlist.includes(symbol)) {
                watchlist.push(symbol);
                renderWatchlist();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'subscribe', symbols: [symbol] }));
                }
                newStockSymbolInput.value = '';
            } else if (watchlist.includes(symbol)) {
                alert('Stock already in watchlist!');
            }
        }

        function removeStock(symbol) {
            watchlist = watchlist.filter(s => s !== symbol);
            renderWatchlist();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'unsubscribe', symbols: [symbol] }));
            }
            if (currentChartSymbol === symbol) {
                clearChart();
            }
        }

        function updateStockPrice(symbol, newPrice) {
            const priceElement = document.getElementById(`price-${symbol}`);
            if (priceElement) {
                const oldPrice = parseFloat(priceElement.textContent);
                priceElement.textContent = newPrice.toFixed(2);

                if (!isNaN(oldPrice)) {
                    if (newPrice > oldPrice) {
                        priceElement.classList.remove('negative');
                        priceElement.classList.add('positive'); // Ensure positive class is there
                        priceElement.innerHTML = `${newPrice.toFixed(2)} <span class="price-change-arrow" style="color: #4CAF50;">&#9650;</span>`; // Up arrow
                    } else if (newPrice < oldPrice) {
                        priceElement.classList.remove('positive');
                        priceElement.classList.add('negative');
                        priceElement.innerHTML = `${newPrice.toFixed(2)} <span class="price-change-arrow" style="color: #f44336;">&#9660;</span>`; // Down arrow
                    } else {
                        priceElement.classList.remove('positive', 'negative');
                        priceElement.innerHTML = `${newPrice.toFixed(2)}`; // No arrow for no change
                    }
                } else {
                    priceElement.classList.remove('positive', 'negative');
                    priceElement.innerHTML = `${newPrice.toFixed(2)}`;
                }
            }
        }

        function selectStockForChart(symbol) {
            currentChartSymbol = symbol;
            chartTitle.textContent = `${symbol} Live Chart`;
            renderChart(symbol);
            if (ws && ws.readyState === WebSocket.OPEN && !chartData[symbol]) {
                 // Request historical data if not already present
                ws.send(JSON.stringify({ type: 'getHistoricalData', symbol: symbol }));
            }
        }

        function clearChart() {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            currentChartSymbol = '';
            chartTitle.textContent = 'Select a stock from watchlist to view chart';
        }

        function renderChart(symbol) {
            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = stockChartCanvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData[symbol] ? chartData[symbol].map(d => d.time) : [],
                    datasets: [{
                        label: `${symbol} Price`,
                        data: chartData[symbol] ? chartData[symbol].map(d => d.value) : [],
                        borderColor: '#e94560',
                        backgroundColor: 'rgba(233, 69, 96, 0.2)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0 // Hide individual data points
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0 // Disable animation for real-time updates
                    },
                    scales: {
                        x: {
                            type: 'category',
                            title: {
                                display: true,
                                text: 'Time',
                                color: '#e0e0e0'
                            },
                            ticks: {
                                color: '#e0e0e0',
                                autoSkip: true,
                                maxTicksLimit: 10
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Price ($)',
                                color: '#e0e0e0'
                            },
                            ticks: {
                                color: '#e0e0e0'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.dataset.label}: $${context.parsed.y.toFixed(2)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateChart(symbol, price, timestamp) {
            if (!chartData[symbol]) {
                chartData[symbol] = [];
            }
            const time = new Date(timestamp).toLocaleTimeString();
            chartData[symbol].push({ time, value: price });

            // Keep chart data to a reasonable length (e.g., last 60 points for 1 minute data)
            const MAX_CHART_POINTS = 60;
            if (chartData[symbol].length > MAX_CHART_POINTS) {
                chartData[symbol].shift(); // Remove the oldest point
            }

            if (symbol === currentChartSymbol && chartInstance) {
                chartInstance.data.labels = chartData[symbol].map(d => d.time);
                chartInstance.data.datasets[0].data = chartData[symbol].map(d => d.value);
                chartInstance.update();
            }
        }

        function renderActiveAlerts() {
            activeAlertsList.innerHTML = '';
            activeAlerts.forEach(alert => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <span>${alert.symbol} ${alert.condition} $${alert.value.toFixed(2)}</span>
                    <button class="remove-alert-btn" onclick="removeAlert('${alert.symbol}', '${alert.condition}', ${alert.value})">&times;</button>
                `;
                activeAlertsList.appendChild(listItem);
            });
            localStorage.setItem('activeAlerts', JSON.stringify(activeAlerts));
        }

        function setAlert() {
            const symbol = alertSymbolInput.value.toUpperCase().trim();
            const condition = alertConditionSelect.value;
            const value =
