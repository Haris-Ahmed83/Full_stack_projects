<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Booking App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Maps API script - REPLACE 'YOUR_GOOGLE_MAPS_API_KEY' with your actual key -->
    <!-- Get a key from: https://developers.google.com/maps/documentation/javascript/get-started -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap"></script>
</head>
<body>
    <header>
        <h1><span class="icon">🚗</span> Ride Booker</h1>
    </header>
    <main>
        <section class="ride-input-section card">
            <div class="input-group">
                <label for="pickup-location">Pickup Location:</label>
                <input type="text" id="pickup-location" placeholder="Enter pickup location">
            </div>
            <div class="input-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" placeholder="Enter destination">
            </div>
            <button id="find-ride-btn">Find Ride</button>
        </section>

        <section class="ride-details-section card">
            <h2>Ride Details</h2>
            <p id="ride-status" class="status-message"></p>
            <div class="details-grid">
                <div><strong>Distance:</strong> <span id="distance">N/A</span></div>
                <div><strong>Duration:</strong> <span id="duration">N/A</span></div>
                <div><strong>Estimated Fare:</strong> <span id="fare">N/A</span></div>
            </div>
            <div class="button-group">
                <button id="book-ride-btn" disabled>Book Ride</button>
                <button id="cancel-ride-btn" class="hidden">Cancel Ride</button>
            </div>
        </section>

        <section class="map-section card">
            <div id="map"></div>
        </section>

        <section class="ride-history-section card">
            <h2>Ride History</h2>
            <ul id="ride-history-list">
                <!-- Ride history items will be inserted here by JavaScript -->
            </ul>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
