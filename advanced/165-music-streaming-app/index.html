<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Stream</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1 class="app-logo">Music Stream</h1>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search songs, artists, albums...">
                <button id="search-button" aria-label="Search"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <nav class="main-nav">
                    <ul>
                        <li><a href="#" class="nav-item active" data-view="home"><i class="fas fa-home"></i> Home</a></li>
                        <li><a href="#" class="nav-item" data-view="library"><i class="fas fa-compact-disc"></i> Library</a></li>
                        <li><a href="#" class="nav-item" data-view="queue"><i class="fas fa-stream"></i> Queue</a></li>
                    </ul>
                </nav>
                <div class="playlists-section">
                    <h2>My Playlists</h2>
                    <ul id="playlists-list">
                        <!-- Playlists will be loaded here by JS -->
                        <li class="no-results-message">No playlists yet.</li>
                    </ul>
                </div>
            </aside>

            <section class="content-area">
                <div id="home-view" class="view active">
                    <h2>Explore Music</h2>
                    <div id="explore-tracks-list" class="track-list grid">
                        <!-- All tracks will be loaded here -->
                    </div>
                </div>
                <div id="library-view" class="view">
                    <h2>All Tracks</h2>
                    <div id="all-tracks-list" class="track-list list">
                        <!-- All tracks will be loaded here -->
                    </div>
                </div>
                <div id="search-results-view" class="view">
                    <h2>Search Results</h2>
                    <div id="search-results-list" class="track-list list">
                        <p class="no-results-message">Start typing to search for music.</p>
                    </div>
                </div>
                <div id="playlist-detail-view" class="view">
                    <h2 id="playlist-detail-title">Playlist Name</h2>
                    <div id="playlist-detail-tracks" class="track-list list">
                        <!-- Tracks for selected playlist -->
                    </div>
                </div>
                <div id="queue-view" class="view">
                    <h2>Current Queue</h2>
                    <div id="current-queue-list" class="track-list list">
                        <p class="no-results-message">Queue is empty. Add some songs!</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="player-bar">
            <div class="track-info">
                <img id="player-cover" src="https://via.placeholder.com/60" alt="Album Cover" class="cover-art">
                <div class="details">
                    <div id="player-title" class="title">No track playing</div>
                    <div id="player-artist" class="artist"></div>
                </div>
            </div>
            <div class="player-controls">
                <div class="buttons">
                    <button id="prev-button" aria-label="Previous track"><i class="fas fa-backward"></i></button>
                    <button id="play-pause-button" aria-label="Play/Pause"><i class="fas fa-play"></i></button>
                    <button id="next-button" aria-label="Next track"><i class="fas fa-forward"></i></button>
                </div>
                <div class="progress-bar">
                    <span id="current-time" class="time">0:00</span>
                    <input type="range" id="progress-slider" min="0" value="0" step="0.1" aria-label="Track progress">
                    <span id="duration" class="time">0:00</span>
                </div>
            </div>
            <div class="volume-controls">
                <button id="volume-mute-button" aria-label="Mute volume"><i class="fas fa-volume-down"></i></button>
                <input type="range" id="volume-slider" min="0" max="1" value="0.7" step="0.01" aria-label="Volume slider">
                <button id="volume-max-button" aria-label="Max volume"><i class="fas fa-volume-up"></i></button>
            </div>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
