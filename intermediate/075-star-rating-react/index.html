<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rating-container">
        <h1>Rate Our Service</h1>
        <p class="rating-description">Please select your rating:</p>
        <div class="star-rating" role="radiogroup" aria-label="Star Rating">
            <!-- Stars will be injected here by JavaScript -->
        </div>
        <div class="rating-display">
            You have rated: <span id="current-rating-value">0</span> stars.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
