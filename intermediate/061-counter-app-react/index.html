<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Vanilla Counter</h1>
        <div class="counter-display">
            <span id="count" class="count-value">0</span>
        </div>
        <div class="controls">
            <button id="decrementBtn" class="btn">Decrement</button>
            <button id="resetBtn" class="btn reset-btn">Reset</button>
            <button id="incrementBtn" class="btn">Increment</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
