<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Movie Search App</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for movies..." autocomplete="off">
        </div>
    </header>

    <main id="movieGrid" class="movie-grid">
        <p class="initial-message">Start typing to search for movies!</p>
        <!-- Movie cards will be dynamically inserted here by JavaScript -->
    </main>

    <script src="script.js"></script>
</body>
</html>
