<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none; /* Hidden by default, shown by JS */
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #progressBarContainer {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
            display: none; /* Hidden by default, shown by JS */
        }
        #progressBar {
            width: 0%;
            height: 25px;
            background-color: #28a745;
            text-align: center;
            line-height: 25px;
            color: white;
            transition: width 0.3s ease-in-out;
        }
        #progressText {
            margin-top: 5px;
            font-size: 0.9em;
            color: #555;
        }
        #uploadedFiles {
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        #uploadedFiles h3 {
            color: #333;
            margin-bottom: 15px;
        }
        #uploadedFiles ul {
            list-style: none;
            padding: 0;
        }
        #uploadedFiles li {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #uploadedFiles li a {
            color: #007bff;
            text-decoration: none;
            word-break: break-all;
        }
        #uploadedFiles li a:hover {
            text-decoration: underline;
        }
        #uploadedFiles li span {
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>File Upload App</h1>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fileInput">Choose File:</label>
                <input type="file" id="fileInput" name="myFile" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx" required>
            </div>
            <div id="validationMessage" class="message error"></div>
            <div class="form-group">
                <button type="submit" id="uploadButton">Upload</button>
            </div>
        </form>

        <div id="progressBarContainer">
            <div id="progressBar"></div>
            <div id="progressText">0%</div>
        </div>

        <div id="uploadMessage" class="message success"></div>

        <div id="uploadedFiles">
            <h3>Uploaded Files</h3>
            <ul id="fileList">
                <!-- Uploaded files will be listed here by JavaScript -->
                <li style="display: none;">No files uploaded yet.</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadForm = document.getElementById('uploadForm');
            const fileInput = document.getElementById('fileInput');
            const uploadButton = document.getElementById('uploadButton');
            const validationMessage = document.getElementById('validationMessage');
            const uploadMessage = document.getElementById('uploadMessage');
            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const fileList = document.getElementById('fileList');

            const API_BASE_URL = 'http://localhost:3000/upload'; // Adjust if your backend runs on a different port/path

            // Function to display messages
            function showMessage(element, text, type) {
                element.textContent = text;
                element.className = `message ${type}`;
                element.style.display = 'block';
            }

            // Function to hide messages
            function hideMessage(element) {
                element.style.display = 'none';
                element.textContent = '';
            }

            // Function to update progress bar
            function updateProgressBar(percentage) {
                progressBarContainer.style.display = 'block';
                progressBar.style.width = `${percentage}%`;
                progressBar.textContent = `${percentage}%`;
                progressText.textContent = `${percentage}%`;
                if (percentage === 100) {
                    setTimeout(() => {
                        progressBarContainer.style.display = 'none';
                    }, 1000); // Hide after a short delay
                }
            }

            // Initial state
            hideMessage(validationMessage);
            hideMessage(uploadMessage);
            progressBarContainer.style.display = 'none';

            uploadForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                hideMessage(validationMessage);
                hideMessage(uploadMessage);
                updateProgressBar(0);
                uploadButton.disabled = true;
                uploadButton.textContent = 'Uploading...';

                const file = fileInput.files[0];

                if (!file) {
                    showMessage(validationMessage, 'Please select a file to upload.', 'error');
                    uploadButton.disabled = false;
                    uploadButton.textContent = 'Upload';
                    return;
                }

                // Client-side validation (example: file type and size)
                const allowedTypes = ['image/jpeg', 'image/png', 'application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                const maxSize = 5 * 1024 * 1024; // 5MB

                if (!allowedTypes.includes(file.type)) {
                    showMessage(validationMessage, 'Invalid file type. Allowed: JPG, PNG, PDF, DOC, DOCX.', 'error');
                    uploadButton.disabled = false;
                    uploadButton.textContent = 'Upload';
                    return;
                }

                if (file.size > maxSize) {
                    showMessage(validationMessage, 'File size exceeds 5MB limit.', 'error');
                    uploadButton.disabled = false;
                    uploadButton.textContent = 'Upload';
                    return;
                }

                const formData = new FormData();
                formData.append('myFile', file); // 'myFile' must match the field name Multer expects on the server

                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', API_BASE_URL, true);

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percentage = Math.round((e.loaded / e.total) * 100);
                            updateProgressBar(percentage);
                        }
                    });

                    xhr.onload = () => {
                        uploadButton.disabled = false;
                        uploadButton.textContent = 'Upload';
                        if (xhr.status >= 200 && xhr.status < 300) {
                            const response = JSON.parse(xhr.responseText);
                            showMessage(uploadMessage, `File uploaded successfully! ${response.message || ''}`, 'success');
                            fileInput.value = ''; // Clear the input
                            addFileToList(response.file); // Add uploaded file to list
                        } else {
                            const errorResponse = JSON.parse(xhr.responseText);
                            showMessage(validationMessage, `Upload failed: ${errorResponse.message || 'Server error.'}`, 'error');
                        }
                    };

                    xhr.onerror = () => {
                        uploadButton.disabled = false;
                        uploadButton.textContent = 'Upload';
                        showMessage(validationMessage, 'Network error. Could not reach server.', 'error');
                    };

                    xhr.send(formData);

                } catch (error) {
                    console.error('Upload error:', error);
                    showMessage(validationMessage, 'An unexpected error occurred during upload.', 'error');
                    uploadButton.disabled = false;
                    uploadButton.textContent = 'Upload';
                }
            });

            function addFileToList(fileInfo) {
                if (!fileInfo || !fileInfo.filename) return;

                // Remove "No files uploaded yet." if it's there
                const noFilesMessage = fileList.querySelector('li[style*="display: none"]');
                if (noFilesMessage) {
                    noFilesMessage.remove();
                }

                const listItem = document.createElement('li');
                const fileLink = document.createElement('a');
                fileLink.href = fileInfo.path || `/uploads/${fileInfo.filename}`; // Assuming /uploads is where files are served
                fileLink.target = '_blank';
                fileLink.textContent = fileInfo.originalname || fileInfo.filename;

                const fileSizeSpan = document.createElement('span');
                if (file
