<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs - These are essential for Firebase functionality -->
    <!-- v8.10.0 is used for broad compatibility; newer versions might have slightly different initialization -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <header>
        <h1>Firebase Authentication Demo</h1>
    </header>
    <main class="container">
        <!-- Authentication Section (Sign Up / Sign In Form) -->
        <section id="auth-section" class="card">
            <h2 id="auth-form-title">Sign Up</h2>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="your.email@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <p id="error-message" class="error-message"></p>
            <div class="button-group">
                <button id="signup-btn" class="btn primary-btn">Sign Up</button>
                <!-- Sign In button is initially hidden and toggled by JavaScript -->
                <button id="signin-btn" class="btn primary-btn" style="display: none;">Sign In</button>
            </div>
            <p id="auth-toggle-link" class="auth-toggle">Already have an account? <a href="#">Sign In</a></p>
        </section>

        <!-- Protected Content Section (Displayed only when logged in) -->
        <section id="protected-section" class="card" style="display: none;">
            <h2>Welcome! You are logged in.</h2>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>User ID:</strong> <span id="user-uid"></span></p>
            <button id="logout-btn" class="btn secondary-btn">Logout</button>
        </section>
    </main>
    <!-- Defer loading script.js to ensure DOM is fully parsed and Firebase SDKs are available -->
    <script src="script.js" defer></script>
</body>
</html>
