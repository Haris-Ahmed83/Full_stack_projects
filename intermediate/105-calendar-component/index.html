<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Component</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }

        .calendar-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.8em;
            color: #333;
        }

        .calendar-header button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .calendar-header button:hover {
            background-color: #0056b3;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-weekdays {
            text-align: center;
            font-weight: bold;
            color: #555;
            padding: 10px 0;
            background-color: #e9ecef;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .day-cell {
            padding: 10px 5px;
            text-align: center;
            border-radius: 5px;
            background-color: #f8f9fa;
            color: #333;
            min-height: 60px; /* Ensure consistent height */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-size: 1.1em;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .day-cell:hover:not(.inactive) {
            background-color: #e2e6ea;
        }

        .day-cell.inactive {
            color: #ccc;
            background-color: #f0f0f0;
            cursor: default;
        }

        .day-cell.today {
            background-color: #ffe0b2; /* Light orange */
            border: 2px solid #ff9800; /* Orange */
            font-weight: bold;
            color: #333;
        }

        .day-cell .date-number {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-cell .event-indicator {
            width: 8px;
            height: 8px;
            background-color: #28a745; /* Green for events */
            border-radius: 50%;
            margin-top: 5px;
            position: absolute;
            bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prevMonth">Previous</button>
            <h2 id="currentMonthYear"></h2>
            <button id="nextMonth">Next</button>
        </div>
        <div class="calendar-grid calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div class="calendar-grid" id="calendarDays">
            <!-- Day cells will be populated by JavaScript -->
        </div>
    </div>

    <script>
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        const calendarDays = document.getElementById('calendarDays');
        const currentMonthYear = document.getElementById('currentMonthYear');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        // Hardcoded example events
        const events = {
            '2023-11-15': ['Project Review'],
            '2023-11-20': ['Team Meeting'],
            '2023-12-05': ['Holiday Party'],
            '2024-01-10': ['New Year Planning']
        };

        function renderCalendar() {
            calendarDays.innerHTML = ''; // Clear previous days
            currentMonthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay(); // 0 for Sunday, 1 for Monday, etc.
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            // Render days from previous month
            for (let i = firstDayOfMonth; i > 0; i--) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell', 'inactive');
                dayCell.innerHTML = `<span class="date-number">${daysInPrevMonth - i + 1}</span>`;
                calendarDays.appendChild(dayCell);
            }

            // Render current month's days
            for (let i = 1; i <= daysInMonth; i++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.innerHTML = `<span class="date-number">${i}</span>`;

                // Mark today's date
                if (i === currentDate.getDate() && currentMonth === currentDate.getMonth() && currentYear === currentDate.getFullYear()) {
                    dayCell.classList.add('today');
                }

                // Check for events
                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                if (events[dateKey]) {
                    const eventIndicator = document.createElement('div');
                    eventIndicator.classList.add('event-indicator');
                    dayCell.appendChild(eventIndicator);
                    dayCell.title = events[dateKey].join('\n'); // Show events on hover
                }

                calendarDays.appendChild(dayCell);
            }

            // Render days from next month (to fill the grid)
            const totalDaysRendered = firstDayOfMonth + daysInMonth;
            const remainingCells = (7 - (totalDaysRendered % 7)) % 7; // Ensure 6 rows or complete last row
            
            for (let i = 1; i <= remainingCells; i++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell', 'inactive');
                dayCell.innerHTML = `<span class="date-number">${i}</span>`;
                calendarDays.appendChild(dayCell);
            }

            // If only 5 rows are filled, add another full row of inactive cells
            if (calendarDays.children.length < 42 && calendarDays.children.length % 7 !== 0) {
                 const daysToFill = 42 - calendarDays.children.length;
                 let startDay = parseInt(calendarDays.lastChild.querySelector('.date-number').textContent) + 1;
                 for (let i = 0; i < daysToFill; i++) {
                     const dayCell = document.createElement('div');
                     dayCell.classList.add('day-cell', 'inactive');
                     dayCell.innerHTML = `<span class="date-number">${startDay + i}</span>`;
                     calendarDays.appendChild(dayCell);
                 }
            } else if (calendarDays.children.length < 35) { // Ensure at least 5 rows
                const daysToFill = 35 - calendarDays.children.length;
                let startDay = parseInt(calendarDays.lastChild.querySelector('.date-number').textContent) + 1;
                for (let i = 0; i < daysToFill; i++) {
                    const dayCell = document.createElement('div');
                    dayCell.classList.add('day-cell', 'inactive');
                    dayCell.innerHTML = `<span class="date-number">${startDay + i}</span>`;
