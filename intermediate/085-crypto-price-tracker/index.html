<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #16213e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #0f3460;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .crypto-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .crypto-selector label {
            font-size: 1.1em;
            color: #a0a0a0;
        }
        .crypto-selector select {
            padding: 10px 15px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background-color: #0f3460;
            color: #e0e0e0;
            font-size: 1em;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            min-width: 150px;
        }
        .crypto-selector select:hover {
            border-color: #537fe7;
            box-shadow: 0 0 10px rgba(83, 127, 231, 0.5);
        }
        .crypto-selector button {
            padding: 10px 20px;
            background-color: #537fe7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .crypto-selector button:hover {
            background-color: #406ac5;
            transform: translateY(-2px);
        }
        .price-display {
            text-align: center;
            margin-bottom: 30px;
            background-color: #0f3460;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .price-display h2 {
            margin: 0 0 10px 0;
            color: #e0e0e0;
            font-size: 1.8em;
        }
        .price-display p {
            font-size: 2.5em;
            font-weight: 700;
            color: #e7e7e7;
            margin: 0;
            letter-spacing: 0.5px;
        }
        .price-display .change {
            font-size: 1.2em;
            margin-top: 5px;
        }
        .price-display .positive {
            color: #4CAF50; /* Green */
        }
        .price-display .negative {
            color: #F44336; /* Red */
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            background-color: #0f3460;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(22, 33, 62, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
            transition: opacity 0.3s ease;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #537fe7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #F44336;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crypto Price Tracker</h1>

        <div class="crypto-selector">
            <label for="cryptoSelect">Select Cryptocurrency:</label>
            <select id="cryptoSelect">
                <!-- Options will be populated by JavaScript -->
            </select>
            <button id="trackButton">Track Price</button>
        </div>

        <div class="price-display">
            <h2 id="currentCryptoName">Select a cryptocurrency to track</h2>
            <p id="currentPrice">--</p>
            <p id="priceChange" class="change"></p>
        </div>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
            <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                <div class="loading-spinner"></div>
            </div>
        </div>
        <p id="errorMessage" class="error-message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
    <script>
        const cryptoSelect = document.getElementById('cryptoSelect');
        const trackButton = document.getElementById('trackButton');
        const currentCryptoName = document.getElementById('currentCryptoName');
        const currentPriceElement = document.getElementById('currentPrice');
        const priceChangeElement = document.getElementById('priceChange');
        const priceChartCanvas = document.getElementById('priceChart');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessageElement = document.getElementById('errorMessage');

        let priceChart;
        let trackedCryptoId = '';
        let currentPrice = null;
        let webSocket = null;
        let chartData = [];
        const MAX_CHART_POINTS = 60; // Keep roughly 1 hour of data at 1-minute intervals

        // CoinGecko API base URL (for initial list and historical data)
        const COINGECKO_API_BASE = 'https://api.coingecko.com/api/v3';
        // CoinGecko WebSocket API for real-time price (requires a paid plan or alternative for production)
        // For demonstration, we'll simulate real-time updates or use a public WebSocket if available.
        // Public WebSocket: wss://ws.coingecko.com/prices/public/v1/simple/websocket
        // Note: The public WebSocket is limited and might not always work as expected without API key.
        // For a robust real-time solution, a backend proxy is often used.
        const COINGECKO_WS_URL = 'wss://ws.coingecko.com/prices/public/v1/simple/websocket';

        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        function showError(message) {
            errorMessageElement.textContent = message;
            errorMessageElement.style.display = 'block';
        }

        function hideError() {
            errorMessageElement.style.display = 'none';
        }

        // Fetch list of cryptocurrencies for the dropdown
        async function fetchCryptoList() {
            showLoading();
            try {
                const response = await fetch(`${COINGECKO_API_BASE}/coins/list?include_platform=false`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                // Filter for popular cryptos and sort them
                const popularCryptos = [
                    { id: 'bitcoin', name: 'Bitcoin', symbol: 'btc' },
                    { id: 'ethereum', name: 'Ethereum', symbol: 'eth' },
                    { id: 'ripple', name: 'XRP', symbol: 'xrp' },
                    { id: 'cardano', name: 'Cardano', symbol: 'ada' },
                    { id: 'solana', name: 'Solana', symbol: 'sol' },
                    { id: 'dogecoin', name: 'Dogecoin', symbol: 'doge' },
                    { id: 'polkadot', name: 'Polkadot', symbol: 'dot' },
                    { id: 'litecoin', name: 'Litecoin', symbol: 'ltc' },
                    { id: 'binancecoin', name: 'BNB', symbol: 'bnb' },
                    { id: 'avalanche-2', name: 'Avalanche', symbol: 'avax' }
                ];

                // Add other cryptos if they are not in the popular list, then sort alphabetically
                const allCryptos = [...popularCryptos];
                data.forEach(crypto => {
                    if (!popularCryptos.some(pc => pc.id === crypto.id)) {
                        allCryptos.push({ id: crypto.id, name: crypto.name, symbol: crypto.symbol });
                    }
                });

                allCryptos.sort((a, b) => a.name.localeCompare(b.name));

                allCryptos.forEach(crypto => {
                    const option = document.createElement('option');
                    option.value = crypto.id;
                    option.textContent = `${crypto.name} (${crypto.symbol.toUpperCase()})`;
                    cryptoSelect.appendChild(option);
                });

                // Set initial selection
                if (allCryptos.length > 0) {
                    cryptoSelect.value = 'bitcoin';
                    trackedCryptoId = 'bitcoin';
                    currentCryptoName.textContent = 'Bitcoin (BTC)';
                    fetchHistoricalData(trackedCryptoId);
                }
            } catch (error) {
                console.error("Error fetching crypto list:", error);
                showError("Failed to load cryptocurrency list. Please try again later.");
            } finally {
                hideLoading();
            }
        }

        // Fetch historical data for the chart (last 24 hours, 1-minute interval)
        async function fetchHistoricalData(cryptoId) {
            showLoading();
            hideError();
            try {
                const response = await fetch(`${COINGECKO_API_BASE}/coins/${cryptoId}/market_chart?vs_currency=usd&days=1&interval=hourly`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                chartData = data.prices.map(([timestamp, price]) => ({
                    x: moment(timestamp),
                    y: price
                }));
                
                // Keep only the latest MAX_CHART_POINTS
                if (chartData.length > MAX_CHART_POINTS) {
                    chartData = chartData.slice(chartData.length - MAX_CHART_POINTS);
                }

                updateChart();
                updateCurrentPriceDisplay(chartData[chartData.length - 1].y);
                connectWebSocket(cryptoId); // Connect WebSocket after historical data is loaded
            } catch (error) {
                console.error("Error fetching historical data:", error);
                showError(`Failed to load historical data for ${cryptoId}.`);
                // If historical data fails, still try to
